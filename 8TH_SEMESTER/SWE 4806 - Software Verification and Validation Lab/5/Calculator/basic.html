<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="wrap">
      <p class="eyebrow">Basic Calculator</p>
      <h1>add &middot; subtract &middot; multiply &middot; divide</h1>

      <div class="card">
        <div class="field">
          <label for="a">Value A</label>
          <input type="number" id="a" value="10" />
        </div>
        <div class="field">
          <label for="b">Value B</label>
          <input type="number" id="b" value="2" />
        </div>

        <div class="op-row">
          <button data-op="add" class="active">Add</button>
          <button data-op="subtract">Subtract</button>
          <button data-op="multiply">Multiply</button>
          <button data-op="divide">Divide</button>
        </div>

        <button class="calc-button" id="calcBtn">Calculate</button>

        <div class="result">
          <span class="label">Result</span>
          <span class="value" id="output">&mdash;</span>
        </div>
      </div>

      <a class="back" href="index.html">&larr; Back to home</a>
    </div>

    <!-- src/basic.js is a plain CommonJS module (module.exports = {...}),
         written for Node/Jest. This shim gives it a `module` global to
         write to when loaded directly as a browser <script>, without
         touching src/basic.js itself. -->
    <script>
      window.module = { exports: {} };
    </script>
    <script src="src/basic.js"></script>
    <script>
      window.basicCalc = window.module.exports;

      let currentOp = "add";
      const opButtons = document.querySelectorAll(".op-row button");
      opButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          opButtons.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentOp = btn.dataset.op;
        });
      });

      document.getElementById("calcBtn").addEventListener("click", () => {
        const a = parseFloat(document.getElementById("a").value);
        const b = parseFloat(document.getElementById("b").value);
        const result = window.basicCalc[currentOp](a, b);
        document.getElementById("output").textContent = result;
      });
    </script>
  </body>
</html>
